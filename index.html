<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Tools</title>
  <style>
    :root{
      --red:#d71920;
      --red-dark:#b90f16;
      --ink:#171717;
      --muted:#777;
      --line:#e9e9e9;
      --soft:#f7f7f7;
      --shadow:0 12px 34px rgba(0,0,0,.055);
    }
    *{box-sizing:border-box}
    html{min-height:100%}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      background:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      -webkit-font-smoothing:antialiased;
      padding:44px 28px 28px;
    }
    body::before{
      content:"";
      position:fixed;
      left:0;top:0;
      width:100%;height:4px;
      background:var(--red);
      z-index:10;
    }
    .page{width:min(980px,100%);margin:0 auto;min-height:calc(100vh - 72px);display:flex;flex-direction:column}
    header{text-align:center;padding:8px 0 48px}
    .brand-logo{
      width:min(320px,62vw);max-height:130px;object-fit:contain;display:block;margin:auto;
      animation:brandIn .8s cubic-bezier(.16,1,.3,1) both;
    }
    .tools{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }
    .tool{
      position:relative;
      min-height:224px;
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      padding:30px 40px;
      color:var(--ink);text-decoration:none;
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      overflow:hidden;
      opacity:0;
      transform:translateY(18px);
      animation:cardIn .7s cubic-bezier(.16,1,.3,1) forwards;
      transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s ease,border-color .35s ease;
    }
    .tool:nth-child(1){animation-delay:.10s}
    .tool:nth-child(2){animation-delay:.18s}
    .tool:nth-child(3){animation-delay:.26s}
    .tool:nth-child(4){animation-delay:.34s}
    .tool:nth-child(5){animation-delay:.42s}
    .tool-new{
      border:1.5px solid #e7aeb2;
      background:linear-gradient(145deg,#fff 0%,#fff8f8 100%);
      box-shadow:0 8px 28px rgba(215,25,32,.09),inset 0 0 22px rgba(215,25,32,.025);
    }
    .tool-new::before{
      content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(135deg,rgba(215,25,32,.65),rgba(255,255,255,.15) 42%,rgba(215,25,32,.35));
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
    }
    .tool-new:hover{border-color:#d71920;box-shadow:0 12px 36px rgba(215,25,32,.18),0 0 16px rgba(215,25,32,.12)}
    .new-badge{
      position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;
      padding:6px 11px;border-radius:7px;color:#fff;background:linear-gradient(120deg,#a90d16,#e32931);
      box-shadow:0 3px 12px rgba(183,15,22,.28);font-size:9px;font-weight:850;letter-spacing:.14em;
    }
    .new-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 7px #fff}
    .version-small{position:fixed;left:18px;bottom:14px;z-index:15;font-size:9px;letter-spacing:.12em;color:#aaa;font-weight:650}
    .news-card{position:fixed;right:16px;bottom:14px;z-index:20;width:min(248px,calc(100vw - 28px));padding:10px 12px 11px;background:rgba(255,255,255,.97);border:1px solid #eee0e0;border-left:3px solid var(--red);border-radius:11px;box-shadow:0 7px 22px rgba(0,0,0,.09);animation:cardIn .55s .5s both}
    .news-top{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:5px}
    .news-label{font-size:9px;font-weight:850;letter-spacing:.1em;color:var(--red)}
    .news-version{font-size:9px;color:#aaa}
    .news-card h2{font-size:11px;margin:0 0 4px}
    .news-card p{font-size:9px;line-height:1.55;color:#777;margin:0}
    .news-close{border:0;background:transparent;color:#999;padding:0 3px;font-size:15px;line-height:1}
    .news-close:hover{background:#f7f2f2;color:#333}
    .tool:nth-child(5){grid-column:2}
    .tool:hover{
      transform:translateY(-6px);
      box-shadow:0 20px 44px rgba(0,0,0,.09);
      border-color:#ddd;
    }
    .tool:active{transform:translateY(-2px)}
    .tool:focus-visible{outline:3px solid rgba(215,25,32,.2);outline-offset:4px}

    .logo-box{
      width:190px;height:94px;display:flex;align-items:center;justify-content:center;margin-bottom:17px;
      transition:transform .35s cubic-bezier(.16,1,.3,1);
    }
    .tool:hover .logo-box{transform:translateY(-4px)}
    .logo-box img{max-width:100%;max-height:100%;object-fit:contain;display:block}
    .coco-logo{width:175px}.shouin-logo{width:130px}

    .simple-icon{
      width:70px;height:70px;display:grid;place-items:center;
      font-size:40px;line-height:1;font-weight:300;color:var(--red);
      border:1.5px solid var(--red);border-radius:18px;
      transition:background .3s ease,color .3s ease,transform .3s cubic-bezier(.16,1,.3,1);
    }
    .tool:hover .simple-icon{background:var(--red);color:#fff;transform:translateY(-3px)}

    .name{font-size:21px;line-height:1.25;font-weight:650;letter-spacing:-.02em}
    .desc{margin-top:7px;font-size:13px;color:var(--muted);letter-spacing:.01em}


    footer{margin-top:auto;padding-top:32px;text-align:right;font-size:11px;color:#999;letter-spacing:.02em}


.video-section{margin-top:34px;animation:cardIn .7s .34s cubic-bezier(.16,1,.3,1) both}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 2px 14px}.section-head h2{font-size:19px;margin:0;font-weight:700}.section-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.video-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.video-card{appearance:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:0;overflow:hidden;text-align:left;color:var(--ink);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.045);transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s ease,border-color .3s ease}.video-card:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(0,0,0,.09);border-color:#ddd}.video-thumb{display:block;position:relative;aspect-ratio:16/9;background:#eee;overflow:hidden}.video-thumb video{width:100%;height:100%;object-fit:cover;display:block}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(215,25,32,.94);color:#fff;display:grid;place-items:center;padding-left:2px;font-size:17px;box-shadow:0 7px 20px rgba(0,0,0,.18);transition:transform .25s ease}.video-card:hover .play{transform:translate(-50%,-50%) scale(1.08)}.video-title{display:block;padding:13px 14px 15px;font-size:13px;font-weight:650;line-height:1.45}.video-card:focus-visible{outline:3px solid rgba(215,25,32,.18);outline-offset:3px}@media(max-width:900px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}.tool:nth-child(5){grid-column:1 / -1;max-width:calc(50% - 8px);width:100%;justify-self:center}}
    @media(max-width:820px){.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.video-grid{grid-template-columns:1fr 1fr;gap:10px}.video-title{font-size:12px;padding:11px}.video-section{margin-top:26px}}

    @keyframes brandIn{
      from{opacity:0;transform:translateY(-10px) scale(.98)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    @keyframes cardIn{
      0%{opacity:0;transform:translateY(18px);filter:blur(4px)}
      100%{opacity:1;transform:translateY(0);filter:blur(0)}
    }
    @media(max-width:700px){
      body{padding:34px 16px 22px}.page{min-height:calc(100vh - 56px)}
      header{padding-bottom:30px}.brand-logo{width:min(270px,70vw);max-height:105px}
      .tools{grid-template-columns:1fr;gap:13px}.tool:nth-child(5){grid-column:auto;max-width:none}
      .tool{min-height:190px;border-radius:18px;padding:28px 30px}
      .tool:nth-child(3){min-height:190px;padding:28px 30px}
      footer{padding-top:24px}.news-card{right:10px;bottom:10px;width:min(230px,calc(100vw - 24px))}.version-small{left:10px;bottom:11px;font-size:8px}
    }
    @media(prefers-reduced-motion:reduce){
      .brand-logo,.tool{animation:none;opacity:1;transform:none;filter:none}
      .tool,.tool::before,.tool::after,.logo-box,.simple-icon{transition:none}
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <img class="brand-logo" src="logo.png" alt="ロゴ">
    </header>

    <section class="tools" aria-label="ツール一覧">
      <a class="tool" href="https://web.coco-kids.jp/login" target="_blank" rel="noopener noreferrer">
        <span class="logo-box"><img class="coco-logo" src="coco-kids.png" alt="Coco Kids"></span>
        <span class="name">Coco Kids</span>
        <span class="desc">施設職員用</span>
      </a>

      <a class="tool" href="https://app-daishinto.shouin.io/authentication/login#/?intended=https%3A%2F%2Fapp-daishinto.shouin.io%2Fhome" target="_blank" rel="noopener noreferrer">
        <span class="logo-box"><img class="shouin-logo" src="shouin.png" alt="Shouin"></span>
        <span class="name">Shouin</span>
        <span class="desc">トレーニング・研修</span>
      </a>

      <a class="tool" href="https://mtl-lab.github.io/mtl/" target="_blank" rel="noopener noreferrer">
        <span class="logo-box"><span class="simple-icon" aria-hidden="true">＋</span></span>
        <span>
          <span class="name">画像圧縮等</span>
          <span class="desc">画像関連ツール</span>
        </span>
      </a>

      <a class="tool" href="https://murakami633.github.io/movvvv/" target="_blank" rel="noopener noreferrer" aria-label="動画マニュアルを開く">
        <span class="logo-box"><span class="simple-icon" aria-hidden="true">？</span></span>
        <span>
          <span class="name">説明</span>
          <span class="desc">動画マニュアル</span>
        </span>
      </a>

      <a class="tool tool-new" href="mutsuru-blur/index.html" target="_blank" rel="noopener noreferrer" aria-label="新機能 顔ぼかしを新しいタブで開く">
        <span class="new-badge">NEW</span>
        <span class="logo-box"><span class="simple-icon" aria-hidden="true">◉</span></span>
        <span class="name">顔ぼかし</span>
        <span class="desc">顔・人物を自動検出して写真を加工</span>
      </a>
    </section>
    <footer>制作者：村上颯一</footer>
    <div class="version-small">VER 1.1</div>
    <aside class="news-card" id="news" aria-label="更新ニュース">
      <div class="news-top"><span class="news-label">NEWS / UPDATE</span><span class="news-version">VER 1.1</span><button class="news-close" id="newsClose" type="button" aria-label="ニュースを閉じる">×</button></div>
      <h2>新機能「顔ぼかし」を追加</h2>
      <p>全体プログラムを見直し、ツール一覧を整理・拡張しました。顔・人物の自動検出、モザイク・ぼかし加工に対応した「顔ぼかし」を新しく追加しました。</p>
    </aside>
  </main>
<script>document.getElementById("newsClose")?.addEventListener("click",()=>document.getElementById("news")?.remove());</script>
</body>
</html>
